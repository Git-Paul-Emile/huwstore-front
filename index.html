<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Vérification de propriété du site pour la Search Console Google. -->
    <meta name="google-site-verification" content="iq8pelNCGfhdIivlXSkSLH3asVrG2nxGVEFWpkuosyE" />

    <title>HUWSTORE - Sacs et accessoires, livrés partout au Sénégal</title>
    <meta
      name="description"
      content="Sacs en toile, coton et cuir polyuréthane. Livraison 24 h sur Dakar sauf le dimanche, paiement à la livraison en espèces."
    />
    <meta name="theme-color" content="#faf7f2" />
    <link rel="canonical" href="https://huwstore.com/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ne sait pas lire un SVG comme icone d'accueil : sans ce PNG, un
         raccourci ajoute depuis Safari affiche une capture de la page a la
         place du logo. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Aperçu de partage. WhatsApp est le premier canal de la boutique :
         sans ces balises, un lien partagé n'affiche ni titre ni image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HUWSTORE" />
    <meta property="og:locale" content="fr_SN" />
    <meta property="og:title" content="HUWSTORE - Sacs et accessoires, livrés partout au Sénégal" />
    <meta
      property="og:description"
      content="Sacs en toile, coton et cuir polyuréthane. Livraison 24 h sur Dakar sauf le dimanche, paiement à la livraison."
    />
    <meta property="og:url" content="https://huwstore.com/" />
    <meta property="og:image" content="https://huwstore.com/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Données structurées : ce que Google affiche dans la fiche du site. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Store",
        "name": "HUWSTORE",
        "description": "Sacs en toile, coton et cuir polyuréthane, livrés partout au Sénégal.",
        "url": "https://huwstore.com/",
        "logo": "https://huwstore.com/logo-search.png",
        "telephone": "+221709666259",
        "currenciesAccepted": "XOF",
        "paymentAccepted": "Espèces à la livraison",
        "areaServed": { "@type": "Country", "name": "Sénégal" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
